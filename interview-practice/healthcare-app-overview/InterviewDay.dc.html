<!doctype html>
<html>

</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; }

  </style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #14181c; color: #f2efe8; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-direction: column; padding: 54px 72px 40px 72px; gap: 34px;">

  <div style="display: flex; flex-direction: column; gap: 18px;">

      <span style="margin-left: auto; font-size: 12px; letter-spacing: 0.22em; color: #6d757b;">ON THE DAY</span>
    </div>
    <div style="height: 1px; background: #2b3238;"></div>
  </div>

  <div style="margin-top: auto; display: flex; gap: 56px; align-items: flex-start;">

    <div style="flex: 0 0 392px; display: flex; flex-direction: column; gap: 16px; border-left: 3px solid #55a7ad; padding-left: 28px;">
      <span style="font-size: 13px; letter-spacing: 0.16em; color: #7d858b;">日時</span>
      <span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 54px; font-weight: 700; line-height: 1.25;">10月3日<span style="font-size: 30px;">（木）</span></span>
      <span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 40px; color: #55a7ad;">18:00 スタート</span>
    </div>

    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; border-bottom: 1px solid #2b3238;">
        <span style="font-size: 13px; letter-spacing: 0.16em; color: #7d858b;">集合</span>
        <span style="font-size: 24px; font-weight: 500;">17:40 までに <strong style="font-weight: 700;">関内駅 南口</strong></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; border-bottom: 1px solid #2b3238;">
        <span style="font-size: 13px; letter-spacing: 0.16em; color: #7d858b;">到着後のご連絡先</span>
        <span style="font-size: 24px; font-weight: 500;">内藤　090-8501-3063</span>
      </div>
      <div style="display: flex; gap: 48px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 13px; letter-spacing: 0.16em; color: #7d858b;">形式</span>
          <span style="font-size: 20px; font-weight: 500;">対面（リモート不可）</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 13px; letter-spacing: 0.16em; color: #7d858b;">面談回数</span>
          <span style="font-size: 20px; font-weight: 500;">2回（状況により1回）</span>
        </div>
      </div>
    </div>

  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.1em; color: #6d757b;">
    <span>医療系ソフト開発および保守 ／ 案件概要説明</span>
    <span>08 / 08</span>
