<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0f6a72; text-decoration: none; }
    a:hover { color: #0a4a50; }
  </style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #f5f3ee; color: #1b1e22; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-direction: column; padding: 54px 72px 40px 72px; gap: 30px;">

  <div style="display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: baseline; gap: 24px;">
      <span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 22px; letter-spacing: 0.14em; color: #0f6a72;">04</span>
      <h2 style="margin: 0; font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-weight: 700; font-size: 38px; letter-spacing: 0.04em;">勤務条件</h2>
      <span style="margin-left: auto; font-size: 12px; letter-spacing: 0.22em; color: #8a8f96;">CONDITIONS</span>
    </div>
    <div style="height: 1px; background: #dcd8cf;"></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 56px;">

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0; border-bottom: 1px solid #dcd8cf;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">稼働開始</span>
      <span style="font-size: 22px; font-weight: 500;">11月〜</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0; border-bottom: 1px solid #dcd8cf;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">契約期間</span>
      <span style="font-size: 22px; font-weight: 500;">長期</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0; border-bottom: 1px solid #dcd8cf;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">勤務地</span>
      <span style="font-size: 22px; font-weight: 500;">関内　<span style="font-size: 17px; font-weight: 700; color: #a8492f;">リモート不可／常駐</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0; border-bottom: 1px solid #dcd8cf;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">勤務時間</span>
      <span style="font-size: 22px; font-weight: 500;">09:00 〜 18:00</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0; border-bottom: 1px solid #dcd8cf;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">募集人数</span>
      <span style="font-size: 22px; font-weight: 500;">1名</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0; border-bottom: 1px solid #dcd8cf;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">面談回数</span>
      <span style="font-size: 22px; font-weight: 500;">2回　<span style="font-size: 17px; color: #5b6067;">状況により1回になる可能性あり</span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">外国籍</span>
      <span style="font-size: 22px; font-weight: 500;">可　<span style="font-size: 17px; color: #5b6067;">ビジネスレベルの日本語が必要</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0 18px 0;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: #8a8f96;">通勤</span>
      <span style="font-size: 22px; font-weight: 500;">ご自宅から関内まで50分以内が望ましい</span>
    </div>

  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.1em; color: #8a8f96;">
    <span>医療系ソフト開発および保守 ／ 案件概要説明</span>
    <span>06 / 08</span>
  </div>

</div>
</x-dc>
</body>
</html>
