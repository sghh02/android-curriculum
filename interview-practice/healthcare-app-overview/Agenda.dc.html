<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0f6a72; text-decoration: none; }
    a:hover { color: #0a4a50; }
  </style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #f5f3ee; color: #1b1e22; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-direction: column; padding: 54px 72px 40px 72px; gap: 24px;">

  <div style="display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: baseline; gap: 22px;">
      <span style="width: 26px; height: 3px; background: #0f6a72; align-self: center;"></span>
      <h2 style="margin: 0; font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-weight: 700; font-size: 38px; letter-spacing: 0.04em;">本日の流れ</h2>
      <span style="margin-left: auto; font-size: 12px; letter-spacing: 0.22em; color: #8a8f96;">AGENDA</span>
    </div>
    <div style="height: 1px; background: #dcd8cf;"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: center; gap: 26px; background: #e7efee; border-left: 4px solid #0f6a72; padding: 16px 26px;">
      <span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 30px; color: #0f6a72; flex: 0 0 46px;">01</span>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 24px; font-weight: 700;">案件概要のご説明</span>
        <span style="font-size: 16px; color: #5b6067;">案件の背景、作業内容、勤務条件をこちらからご説明します。</span>
      </div>
      <span style="margin-left: auto; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #ffffff; background: #0f6a72; padding: 7px 16px;">現在ここ</span>
    </div>

    <div style="display: flex; align-items: center; gap: 26px; border-left: 4px solid #dcd8cf; padding: 16px 26px;">
      <span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 30px; color: #a9aeb4; flex: 0 0 46px;">02</span>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 24px; font-weight: 700;">自己紹介</span>
        <span style="font-size: 16px; color: #5b6067;">ご経歴と、これまで担当された開発内容についてお聞かせください。</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 26px; border-left: 4px solid #dcd8cf; padding: 16px 26px;">
      <span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 30px; color: #a9aeb4; flex: 0 0 46px;">03</span>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 24px; font-weight: 700;">ご質問</span>
        <span style="font-size: 16px; color: #5b6067;">経験・スキル・働き方について、こちらから確認させていただきます。</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 26px; border-left: 4px solid #dcd8cf; padding: 16px 26px;">
      <span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 30px; color: #a9aeb4; flex: 0 0 46px;">04</span>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 24px; font-weight: 700;">逆質問</span>
        <span style="font-size: 16px; color: #5b6067;">案件・チーム・進め方について、ご不明な点をお聞かせください。</span>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #5b6067;">
    <span style="width: 6px; height: 6px; background: #a8492f; border-radius: 50%;"></span>
    <span>面談は2回を予定しています（状況により1回になる可能性があります）。</span>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.1em; color: #8a8f96;">
    <span>医療系ソフト開発および保守 ／ 案件概要説明</span>
    <span>02 / 08</span>
  </div>

</div>
</x-dc>
</body>
</html>
